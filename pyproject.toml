[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "powergrid-cyberattack-detection"
version = "2.0.0"
description = "Episode-aware machine-learning benchmark for synthetic smart-grid cyberattack telemetry"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Junaid Hossain"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
notebook = ["jupyter>=1.0,<2", "notebook>=7,<8"]

[project.scripts]
grid-simulate = "generate_synthetic_grid_attack_data:main"
grid-evaluate = "train_cyberattack_detector:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["generate_synthetic_grid_attack_data", "train_cyberattack_detector"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
